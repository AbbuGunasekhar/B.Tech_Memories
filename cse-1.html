<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullscreen Mobile Video</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      video {
        width: 100vw;
        height: 100vh;
        object-fit: cover; /* fills full mobile screen */
        display: block;
        background: black;
      }
    </style>
  </head>
  <body>
    <video id="myVideo" autoplay playsinline controls>
      <source src="./CSE-1.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <script>
      const video = document.getElementById("myVideo");

      // Try autoplay with sound
      window.addEventListener("load", async () => {
        try {
          video.muted = false;
          video.volume = 1.0;
          await video.play();
        } catch (err) {
          console.log("Autoplay with sound blocked:", err);
        }
      });
    </script>
  </body>
</html>
